services:
  postgres:
    image: postgres:16-alpine
    container_name: inzu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inzu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inzu_dev_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-inzuconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inzu -d inzuconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inzu-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./apps/java-api
      dockerfile: Dockerfile
    container_name: inzu-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/inzuconnect
      POSTGRES_USER: ${POSTGRES_USER:-inzu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inzu_dev_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a}
      FRONTEND_URL: http://localhost:4200,http://192.168.1.12:4200
    ports:
      - "8085:8080"

  frontend:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: inzu-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  postgres_data:
    name: inzuconnect_postgres_data
  redis_data:
    name: inzuconnect_redis_data
