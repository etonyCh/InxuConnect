name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API Backend Spring Boot à tester"
        required: true
        default: 'http://localhost:8080'
      web_url:
        description: "URL du site Web Angular à tester"
        required: true
        default: 'http://localhost:4200'

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Attendre le démarrage des services (5 secondes)
        run: sleep 5

      - name: Vérifier la disponibilité de l'API Listings (Spring Boot)
        run: |
          echo "Test de l'URL : ${{ github.event.inputs.api_url }}/api/v1/listings"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ github.event.inputs.api_url }}/api/v1/listings")
          echo "Statut HTTP retourné : $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ La route listings est injoignable ou renvoie une erreur (Status: $STATUS_CODE)"
            exit 1
          fi
          echo "✅ Route listings opérationnelle."

      - name: Vérifier l'accès à la page d'accueil (Web Angular)
        run: |
          echo "Test de l'URL : ${{ github.event.inputs.web_url }}"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ github.event.inputs.web_url }}")
          echo "Statut HTTP retourné : $STATUS_CODE"
          if [ "$STATUS_CODE" -ne 200 ]; then
            echo "❌ Le site Web Angular n'est pas joignable (Status: $STATUS_CODE)"
            exit 1
          fi
          echo "✅ Site Web Angular opérationnel."
