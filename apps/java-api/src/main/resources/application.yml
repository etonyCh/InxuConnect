spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:inzuconnect}}
    username: ${POSTGRES_USER:inzu}
    password: ${POSTGRES_PASSWORD:inzu_dev_password_2026}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

inzuconnect:
  security:
    jwt:
      secret: ${JWT_SECRET:8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a8b8c8d8e8f8a}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:4200,http://localhost:3000,http://localhost,http://192.168.1.12}
